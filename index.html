<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Torneos</title>
  <meta name="description" content="Crea equipos, haz el sorteo y avanza por las etapas del torneo hasta coronar al campeón. Todo se guarda en tu navegador.">
  <meta name="theme-color" content="#111A2C">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 7h6v6h5M4 19h6v6h5M15 13v6h7M22 16h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="16" r="2.6" fill="var(--accent)"/>
        </svg>
        <span class="brand-name">Torneos</span>
      </div>
      <div class="tname">
        <label for="tournament-name" class="sr-only">Nombre del torneo</label>
        <input id="tournament-name" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Nombre del torneo">
        <svg class="tname-pencil" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5V17h2.5l8-8-2.5-2.5-8 8zM15.7 6.8a.9.9 0 0 0 0-1.3l-1.2-1.2a.9.9 0 0 0-1.3 0l-1 1 2.5 2.5 1-1z" fill="currentColor"/></svg>
      </div>
      <ol class="stepper" id="stepper" aria-label="Etapas">
        <li data-step="setup"><span class="step-num">1</span><span class="step-label">Equipos</span></li>
        <li data-step="playing"><span class="step-num">2</span><span class="step-label">Llaves</span></li>
        <li data-step="finished"><span class="step-num">3</span><span class="step-label">Campeón</span></li>
      </ol>
      <button type="button" class="btn btn-ghost btn-sm data-btn" data-action="open-data">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2c-4 0-7 1.3-7 3v10c0 1.7 3 3 7 3s7-1.3 7-3V5c0-1.7-3-3-7-3zm0 1.6c3.3 0 5.4 1 5.4 1.4S13.3 6.4 10 6.4 4.6 5.4 4.6 5 6.7 3.6 10 3.6zM15.4 15c0 .4-2.1 1.4-5.4 1.4S4.6 15.4 4.6 15v-2.2c1.3.7 3.2 1 5.4 1s4.1-.3 5.4-1V15zm0-4.6c0 .4-2.1 1.4-5.4 1.4s-5.4-1-5.4-1.4V8.2c1.3.7 3.2 1 5.4 1s4.1-.3 5.4-1v2.2z" fill="currentColor"/></svg>
        <span>Datos</span>
      </button>
    </div>
  </header>

  <div id="banner" class="banner-slot" aria-live="polite"></div>

  <main id="view" class="view"></main>

  <footer class="footer">
    <p id="save-status" class="save-status" aria-live="polite">Los datos se guardan automáticamente en este navegador.</p>
  </footer>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/tournament.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
